<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Trial FFCM-2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.0/dist/bootstrap-table.min.css">
  </head>
  <body>

<h3>
<a href="https://github.com/dongwd160/FFCM2_Website/docs/TrialModel/Reactions">Return to FFCM-2 website</a>
</h3>


<script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.21.2/dist/bootstrap-table.min.js"></script>
<script src="https://unpkg.com/bootstrap-table@1.21.2/dist/extensions/filter-control/bootstrap-table-filter-control.min.js"></script>
<script src="https://unpkg.com/bootstrap-table@1.21.2/dist/extensions/toolbar/bootstrap-table-toolbar.min.js"></script>
<script src="https://unpkg.com/bootstrap-table@1.21.2/dist/extensions/cookie/bootstrap-table-cookie.min.js"></script>

<div class="table-responsive">
    <table
        id="table"
        data-toggle="table"
        data-show-toggle="true"
        data-search="true"
        data-height="900"
        data-strict-search="true"
        data-page-list="[25, 50, 100, All]"
        data-pagination="true"
        data-cookie="true"
        data-advanced-search="true"
        data-id-table="advancedTable"
        data-cookie-id-table="saveId"
        data-filter-control="true"
        data-filter-show-clear="true"
        data-show-search-clear-button="true"
        data-show-columns="true"
        data-show-columns-search="true"
        data-search-highlight="true"
        data-click-to-select="true"
        data-toolbar="#toolbar"
        data-page-size="25"
        data-escape="false"
        data-search-on-enter-key="false"
        data-show-filter-control-switch="true"
        data-url="/FFCM2_Website/assets/data/trialmodel/trialmodel.json">
        <thead>
            <tr>
            <th data-field="Index" data-halign="center" data-align="center">No.</th>
            <th data-field="Reaction" data-halign="center" data-align="center">Reaction</th>
            <th data-field="ReactionClass" data-halign="center" data-align="center" data-filter-control="select">Species</th>
            <th data-field="Type" data-halign="center" data-align="center">Reaction<br>type</th>
            <th data-field="Keywords" data-halign="center" data-align="center">Parameter<br>type</th>
            <th data-field="Rates" data-halign="center" data-align="center" data-width="300">Rate Constant</th>
            <th data-field="Uncertainty" data-halign="center" data-align="center">Uncertainty<br>factor</th>
            <th data-field="Source" data-halign="center" data-align="center" data-width="275">Source</th>
            <th data-field="Comments" data-halign="center" data-visible="true" data-width="600">Comment</th>
            </tr>
        </thead>
    </table>
</div>    

<script>
    $(function() {
      $('#table').bootstrapTable();
    })
</script>

  </body>
</html>
